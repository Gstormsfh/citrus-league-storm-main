[pytest]
testpaths = tests

# --strict-markers: a misspelled marker is an error, not a test that silently
# stops being excluded by `-m "not network"`.
addopts = --strict-markers

markers =
    network: reaches a live service (Supabase over PostgREST) and needs real VITE_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY; self-skips on the placeholders tests/conftest.py plants. CI runs everything; sandboxes run `pytest -m "not network"`.
