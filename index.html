<html lang="en" style="background: #D4E8B8;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CitrusSports - A Fresh Take on Fantasy Sports</title>

    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- iOS PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CitrusSports" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Join CitrusSports, the fantasy sports platform with a refreshing UI and Stormy AI assistant to help you win your leagues." />
    <meta name="author" content="CitrusSports" />

    <meta property="og:title" content="CitrusSports - A Fresh Take on Fantasy Sports" />
    <meta property="og:description" content="Join CitrusSports, the fantasy sports platform with a refreshing UI and Stormy AI assistant to help you win your leagues." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://citrus-fantasy-sports.web.app" />
    <meta property="og:image" content="https://citrus-fantasy-sports.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CitrusSports" />
    <meta name="twitter:image" content="https://citrus-fantasy-sports.web.app/og-image.png" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9217677881289656"
         crossorigin="anonymous"></script>
  </head>

  <body>
    <div id="root" style="padding: 20px; font-family: sans-serif; text-align: center; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #D4E8B8;">
      <div>
        <h1 style="color: #333; margin-bottom: 20px;">CitrusSports</h1>
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <p style="color: #666;">Loading application...</p>
        <p id="status" style="color: #999; font-size: 12px; margin-top: 10px;">Initializing...</p>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Boot monitor — only touches the DOM if React never mounts.
      // React sets window.__REACT_MOUNTED = true once it renders.
      (function() {
        var statusEl = document.getElementById('status');

        function updateStatus(msg, isError) {
          if (statusEl) {
            statusEl.textContent = msg;
            if (isError) statusEl.style.color = '#dc2626';
          }
        }

        // Listen for JS loading errors (404, network, syntax)
        window.addEventListener('error', function(event) {
          // Don't touch DOM if React already mounted
          if (window.__REACT_MOUNTED) return;
          updateStatus('Error: ' + (event.message || 'script failed'), true);
        }, true);

        // Safety timeout — if React hasn't mounted after 12s, show help text
        setTimeout(function() {
          if (window.__REACT_MOUNTED) return;
          updateStatus('Still loading — please wait...', false);
        }, 6000);

        setTimeout(function() {
          if (window.__REACT_MOUNTED) return;
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center;max-width:600px;margin:0 auto"><h2 style="color:#dc2626;margin-bottom:16px">Page failed to load</h2><p style="color:#666;margin-bottom:16px">JavaScript could not start. Try refreshing or clearing your cache.</p><button onclick="location.reload()" style="padding:8px 24px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer">Reload</button></div>';
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
