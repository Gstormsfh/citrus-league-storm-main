name: Playoff Reconciliation Alerter (hourly)

# ENGINEERING.md §12.13 — hourly check for playoff games marked final in
# nhl_games that have ZERO rows in player_game_stats. Catches the silent
# scrape-miss pattern from the 2026-05-12 incident within 1 hour instead
# of 9-17 days.
#
# Failure mode: the script exits non-zero on any finding, which fails the
# workflow run, which sends GitHub's default failure email to the repo
# owner. If CITRUS_ALERT_SLACK_WEBHOOK or CITRUS_ALERT_PAGERDUTY_KEY are
# configured as repo secrets, the script also escalates through them via
# the existing AlertManager (data-pipeline/monitoring/alerting.py).
on:
  schedule:
    - cron: '0 * * * *'  # hourly, on the hour
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Test-fire: synthesize a finding to verify alert path end-to-end (Phase 3 verification).'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Optional escalation channels — script no-ops if these aren't set.
      CITRUS_ALERT_SLACK_WEBHOOK: ${{ secrets.CITRUS_ALERT_SLACK_WEBHOOK }}
      CITRUS_ALERT_PAGERDUTY_KEY: ${{ secrets.CITRUS_ALERT_PAGERDUTY_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - run: pip install -r data-pipeline/requirements.txt

      # NO continue-on-error — non-zero exit MUST fail the workflow so
      # GitHub emails on the failure. That's the primary alert channel.
      - name: Reconcile playoff game stats
        run: |
          ARGS="--season 2025"
          if [ "${{ inputs.force_fail }}" = "true" ]; then
            ARGS="$ARGS --force-fail"
          fi
          python data-pipeline/monitoring/reconcile_playoff_game_stats.py $ARGS
