name: Deploy Preview

on:
  pull_request:
    branches: ['**']

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Pre-deploy validation (same checks as CI) ────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint apps/web/src/ --max-warnings 0

      - name: Type check (web)
        run: cd apps/web && npx tsc --noEmit

      - name: Type check (server)
        run: cd server && npx tsc --noEmit

      - name: Build shared
        run: npm run build --workspace=packages/shared

      - name: Run web tests
        run: npm run test --workspace=apps/web

      - name: Run server tests
        run: npm run test --workspace=server

      - name: Security audit (high/critical)
        run: npm audit --audit-level=high

  # ── Build & deploy preview (only after validation passes) ───────────
  deploy-preview:
    name: Build & Deploy Preview
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Check Firebase credentials
        id: check-creds
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Firebase preview deploy — FIREBASE_SERVICE_ACCOUNT secret not configured"
          fi
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase preview channel
        if: steps.check-creds.outputs.has_creds == 'true'
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: citrus-fantasy-sports
          expires: 7d

      - name: Post preview URL comment
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.firebase-deploy.outputs.details_url }}';
            const expireTime = '${{ steps.firebase-deploy.outputs.expire_time }}';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = [
              `### :orange_circle: Firebase Preview Deployed`,
              ``,
              `| Detail | Value |`,
              `|--------|-------|`,
              `| **Preview URL** | ${previewUrl} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Expires** | ${expireTime || '7 days'} |`,
              ``,
              `Built from commit ${sha} on branch \`${context.payload.pull_request.head.ref}\`.`,
            ].join('\n');

            // Find and update existing bot comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Firebase Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
