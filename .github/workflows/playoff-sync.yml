name: Playoff Sync (every 15 min)

# Runs frequently during playoff window to keep bracket, series results,
# player playoff stats, and pool standings current.
on:
  schedule:
    - cron: '*/15 * * 4-6 *'  # every 15 min, APRIL-JUNE ONLY (Entry 42: offseason runs failed loudly ~96x/day)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── Offseason guard (Entry 42, 2026-08-10) ──────────────────────
      # The cron above already restricts scheduled runs to Apr-Jun; this
      # guard additionally makes MANUAL dispatches honest in the offseason
      # (green no-op with a notice instead of a guaranteed loud failure).
      # In-window behavior is unchanged: Step 0 still fails loudly on
      # ingest errors per the Round-1 postmortem lesson.
      - name: Offseason window guard
        id: window
        run: |
          M=$(date -u +%-m)
          if [ "$M" -ge 4 ] && [ "$M" -le 6 ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Offseason (month $M) — playoff sync sleeps July-March. Exiting green."
          fi

      - if: steps.window.outputs.in_window == 'true'
        uses: actions/checkout@v4

      - if: steps.window.outputs.in_window == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - if: steps.window.outputs.in_window == 'true'
        run: pip install -r data-pipeline/requirements.txt

      # Step 0: Ingest playoff game schedule into nhl_games so the live
      # scraper (data_scraping_service.py) picks them up automatically.
      # Safe to re-run — uses upsert on game_id. Scans 7 days ahead to
      # catch newly announced games.
      #
      # NO continue-on-error here. If this step fails, every downstream
      # job operates on stale/missing schedule data and the live scraper
      # spins on "No games found in DB schedule" until someone notices
      # by hand. Fail the run loudly so GitHub emails about it.
      - name: Ingest playoff game schedule
        if: steps.window.outputs.in_window == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          START=$(date -d "today" +%Y-%m-%d)
          END=$(date -d "+7 days" +%Y-%m-%d)
          python data-pipeline/acquisition/ingest_playoff_schedule.py --start "$START" --end "$END" --season 2025

      # Step 1: Refresh bracket seeds + initial series rows (safe to re-run)
      - name: Ingest NHL playoff bracket
        if: steps.window.outputs.in_window == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data-pipeline/acquisition/ingest_nhl_playoff_bracket.py --season 2025
        continue-on-error: true

      # Step 2: Link games to series, update wins, trigger pick scoring
      - name: Sync playoff series results
        if: steps.window.outputs.in_window == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data-pipeline/acquisition/sync_playoff_results.py --season 2025
        continue-on-error: true

      # Step 3: Rebuild player_playoff_stats from per-game stats (RPC call)
      - name: Aggregate player playoff stats
        if: steps.window.outputs.in_window == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'data-pipeline')
          from data_pipeline.utils.supabase_rest import SupabaseRest
          db = SupabaseRest()
          result = db.rpc('aggregate_player_playoff_stats_live', {'p_season': 2025})
          print(f'Aggregated {result} player playoff stat rows')
          "
        continue-on-error: true

      # Step 4: Score ALL roster pool leagues using each league's custom
      # scoring_settings (goals weighted X, hits weighted Y, etc.).
      # This is what keeps roster pool standings dynamic to commissioner settings.
      - name: Score playoff roster pools
        if: steps.window.outputs.in_window == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data-pipeline')
          from data_pipeline.utils.supabase_rest import SupabaseRest
          db = SupabaseRest()
          result = db.rpc('score_all_playoff_roster_pools', {})
          print(f'Scored {result} playoff roster pool leagues')
          "
        continue-on-error: true
