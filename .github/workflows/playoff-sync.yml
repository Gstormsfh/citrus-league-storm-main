name: Playoff Sync (every 15 min)

# Runs frequently during playoff window to keep bracket, series results,
# player playoff stats, and pool standings current.
on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - run: pip install -r data-pipeline/requirements.txt

      # Step 1: Refresh bracket seeds + initial series rows (safe to re-run)
      - name: Ingest NHL playoff bracket
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data-pipeline/acquisition/ingest_nhl_playoff_bracket.py --season 2025
        continue-on-error: true

      # Step 2: Link games to series, update wins, trigger pick scoring
      - name: Sync playoff series results
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data-pipeline/acquisition/sync_playoff_results.py --season 2025
        continue-on-error: true

      # Step 3: Rebuild player_playoff_stats from per-game stats (RPC call)
      - name: Aggregate player playoff stats
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'data-pipeline')
          from data_pipeline.utils.supabase_rest import SupabaseRest
          db = SupabaseRest()
          result = db.rpc('aggregate_player_playoff_stats', {'p_season': 2025})
          print(f'Aggregated {result} player playoff stat rows')
          "
        continue-on-error: true

      # Step 4: Score ALL roster pool leagues using each league's custom
      # scoring_settings (goals weighted X, hits weighted Y, etc.).
      # This is what keeps roster pool standings dynamic to commissioner settings.
      - name: Score playoff roster pools
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data-pipeline')
          from data_pipeline.utils.supabase_rest import SupabaseRest
          db = SupabaseRest()
          result = db.rpc('score_all_playoff_roster_pools', {})
          print(f'Scored {result} playoff roster pool leagues')
          "
        continue-on-error: true
