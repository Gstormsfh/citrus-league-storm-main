name: Refresh Career Totals (weekly)

# Writes player_directory.career from the NHL landing endpoint: regular-
# season career totals, the draft, NHL seasons and trophies, one small JSON
# document per player, for the writeups ("897 goals over 21 seasons").
# Stale-first: never-fetched rows first, then anything older than 7 days.
# The log ends with the count of rows carrying a career, the affirmative
# signal that the job did its work.
#
# Manual full rebuild:  gh workflow run refresh-career-totals.yml -f all=true

on:
  schedule:
    - cron: '45 8 * * 0'   # Sundays 08:45 UTC, after the daily directory refresh
  workflow_dispatch:
    inputs:
      all:
        description: 'Refresh every row regardless of age'
        required: false
        default: 'false'
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - run: pip install -r data-pipeline/requirements.txt

      - name: Refresh player_directory.career from the NHL landing endpoint
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
          REFRESH_ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          if [ "${REFRESH_ALL:-false}" = "true" ]; then
            python -u scripts/utilities/populate_career_totals.py --all 2>&1 | tee /tmp/career.log
          else
            python -u scripts/utilities/populate_career_totals.py 2>&1 | tee /tmp/career.log
          fi
          grep -q "rows with career" /tmp/career.log || { echo "::error::no completion line in the log"; exit 1; }
