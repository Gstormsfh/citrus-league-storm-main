name: Refresh Player Directory (daily)

# Discovers and inserts new NHL players into player_directory daily.
# Catches mid-season callups (debutants, AHL recalls, IR returns, trade
# acquisitions) within 24h of their first appearance in raw_shots / rosters.
#
# Background — R7-2 baseline (2026-05-06) found 3 player_ids in raw_shots
# with no player_directory entry: Porter Martone (PHI), Josh Samanski
# (EDM), Alex Bump (PHI) — all 2025-26 NHL debutants whose first games
# came after the last manual refresh on 2026-04-17. See:
#   apps/web/docs/DATA_ORGANIZATION_AUDIT.md §10
#
# The script is idempotent (upsert with on_conflict=season,player_id) so
# re-running daily is safe. Wall-clock is typically 5-10 minutes (32 team
# rosters × 23 players each via the NHL API + raw_shots discovery scan).
#
# Cadence rationale:
#   - Daily year-round is simpler than season-aware scheduling
#   - The R7-3 freshness SLA matrix sets player_directory at 48h in-season
#     / 168h offseason; daily comfortably beats both
#   - NHL API load is trivial (~750 calls/run, well under any rate limit)
on:
  schedule:
    - cron: '15 8 * * *'   # 08:15 UTC daily ≈ 02:15 MDT / 03:15 MST
  workflow_dispatch:        # manual trigger for ad-hoc backfills

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - run: pip install -r data-pipeline/requirements.txt

      # Season is intentionally NOT set in env. The script derives the
      # target season(s) from the current date (Python mirror of the SQL
      # get_nhl_season_year function). Aug/Sep runs populate BOTH the
      # outgoing and incoming season so the first-of-October cron isn't
      # the only chance to populate a brand-new season from scratch. Prior
      # `CITRUS_DEFAULT_SEASON: '2025'` env hardcode is what kept the
      # directory frozen at 2025 while the SQL joins pivoted to 2026 on
      # 2026-10-01 — the silent zero-scoring failure this guard closes.
      - name: Refresh player_directory from rosters + raw_shots discovery
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/utilities/populate_player_directory.py

      # Post-run assertion: the season the SQL joins care about TODAY must
      # have >0 rows after the refresh. This is the workflow-level fail-
      # loudly guard demanded by Task 0D. Even if the script itself somehow
      # returned 0 without erroring, this step catches it — because SQL
      # joins keyed on get_nhl_season_year(today) with a zero-row RHS is
      # the exact failure that scores every player zero on opening night.
      - name: Assert player_directory has rows for today's NHL season
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import sys, datetime as dt
          sys.path.insert(0, 'data-pipeline')
          import _bootstrap
          from data_pipeline.utils.supabase_rest import SupabaseRest
          import os
          db = SupabaseRest(os.environ['VITE_SUPABASE_URL'], os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          today = dt.date.today()
          season = today.year if today.month >= 10 else today.year - 1
          rows = db.select('player_directory', select='player_id', filters=[('season','eq',season)], limit=1)
          if not rows:
            print(f'FAIL: player_directory has zero rows for season={season} (today={today.isoformat()})')
            sys.exit(1)
          print(f'OK: player_directory has rows for season={season}')
          "

      - name: Verify orphan count post-refresh
        if: success()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data-pipeline')
          import _bootstrap
          from data_pipeline.monitoring.critical_table_checks import (
              check_raw_shots_no_orphan_player_ids, supabase_client,
          )
          db = supabase_client()
          result = check_raw_shots_no_orphan_player_ids(db)
          print(f'orphan check: status={result.status} details={result.details}')
          # Don't fail the workflow on WARN — just surface; persistent
          # WARNs after the refresh indicate edge cases (IR/AHL/etc) that
          # need separate investigation per audit §10.7.
          "
