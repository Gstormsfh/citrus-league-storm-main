name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: cd apps/web && npx eslint src/

  typecheck:
    name: Type Check (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript compile check (web)
        run: cd apps/web && npx tsc --noEmit

  typecheck-server:
    name: Type Check (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript compile check (server)
        run: cd server && npx tsc --noEmit

  build:
    name: Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Production build (web)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build --workspace=apps/web

      - name: Bundle size check (600KB per chunk)
        run: |
          echo "=== Bundle Size Report ==="
          oversized=0
          for file in apps/web/dist/assets/*.js; do
            [ -f "$file" ] || continue
            size=$(stat --format=%s "$file")
            size_kb=$((size / 1024))
            name=$(basename "$file")
            if [ "$size_kb" -gt 600 ]; then
              echo "::warning file=$file::Chunk $name is ${size_kb}KB (exceeds 600KB limit)"
              oversized=$((oversized + 1))
            else
              echo "  OK  $name — ${size_kb}KB"
            fi
          done
          echo ""
          if [ "$oversized" -gt 0 ]; then
            echo "::warning::$oversized chunk(s) exceed the 600KB threshold"
          else
            echo "All chunks are within the 600KB budget."
          fi

  build-server:
    name: Build (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build server
        run: npm run build --workspace=server

  test:
    name: Test (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run web tests
        run: npm run test --workspace=apps/web

  test-server:
    name: Test (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run server tests
        run: npm run test --workspace=server

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration file naming
        run: |
          echo "=== Migration Naming Validation ==="
          errors=0
          for file in supabase/migrations/*.sql; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if ! echo "$name" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "::error file=$file::Invalid migration name: $name (expected YYYYMMDDHHMMSS_description.sql)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors migration(s) have invalid naming"
            exit 1
          fi
          echo "All migrations follow naming convention."

      - name: Check for duplicate timestamps
        run: |
          echo "=== Duplicate Timestamp Check ==="
          timestamps=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -I{} basename {} | cut -c1-14 | sort)
          dupes=$(echo "$timestamps" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration timestamps found: $dupes"
            exit 1
          fi
          echo "No duplicate timestamps found."

      - name: Validate SQL syntax (basic)
        run: |
          echo "=== Basic SQL Validation ==="
          errors=0
          for file in supabase/migrations/*.sql; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            # Check for common SQL issues
            if grep -qiP 'DROP\s+TABLE.*CASCADE' "$file" 2>/dev/null; then
              echo "::warning file=$file::$name contains DROP TABLE CASCADE — verify this is intentional"
            fi
            # Check SECURITY DEFINER functions have SET search_path
            if grep -qi 'SECURITY DEFINER' "$file" && ! grep -qi 'SET search_path' "$file"; then
              echo "::error file=$file::$name has SECURITY DEFINER without SET search_path = public"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors migration(s) have security issues"
            exit 1
          fi
          echo "All migrations pass basic validation."

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit (high/critical vulnerabilities)
        run: npm audit --audit-level=high

      - name: Check for hardcoded secrets
        run: |
          echo "=== Secret Pattern Scan ==="
          errors=0
          # Scan source files for common secret patterns
          for dir in apps/web/src server/src packages/shared/src; do
            [ -d "$dir" ] || continue
            # API keys, tokens, passwords in string literals
            if grep -rn --include="*.ts" --include="*.tsx" \
              -E "(sk_live_|pk_live_|ghp_|gho_|xoxb-|xoxp-|AKIA[A-Z0-9]{16})" "$dir" 2>/dev/null; then
              echo "::error::Potential hardcoded secret found in $dir"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Check for console.log in production code
        run: |
          echo "=== Console.log Audit ==="
          violations=0
          for dir in apps/web/src server/src packages/shared/src; do
            [ -d "$dir" ] || continue
            # Find console.log in non-test, non-config files
            matches=$(grep -rn "console\.\(log\|debug\|info\)" "$dir" \
              --include="*.ts" --include="*.tsx" \
              --exclude-dir="__tests__" \
              --exclude="logger.ts" --exclude="vite-env.d.ts" \
              --exclude="requestContext.ts" --exclude="app.ts" \
              2>/dev/null | grep -v "// " | grep -v "test" || true)
            if [ -n "$matches" ]; then
              echo "$matches" | while read -r line; do
                echo "::warning::$line"
              done
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found console.log usage — prefer logger from @citrus/shared"
          fi
          echo "Console.log audit complete."
