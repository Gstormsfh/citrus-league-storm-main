name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ESLint (fail on warnings)
        run: npx eslint apps/web/src/ --max-warnings 0

  typecheck:
    name: Type Check (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript compile check (web)
        run: cd apps/web && npx tsc --noEmit

  typecheck-server:
    name: Type Check (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript compile check (server)
        run: cd server && npx tsc --noEmit

  build:
    name: Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Production build (web)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build --workspace=apps/web

      - name: Bundle size check (600KB per chunk)
        run: |
          echo "=== Bundle Size Report ==="
          oversized=0
          for file in apps/web/dist/assets/*.js; do
            [ -f "$file" ] || continue
            size=$(stat --format=%s "$file")
            size_kb=$((size / 1024))
            name=$(basename "$file")
            if [ "$size_kb" -gt 600 ]; then
              echo "::warning file=$file::Chunk $name is ${size_kb}KB (exceeds 600KB limit)"
              oversized=$((oversized + 1))
            else
              echo "  OK  $name — ${size_kb}KB"
            fi
          done
          echo ""
          if [ "$oversized" -gt 0 ]; then
            echo "::warning::$oversized chunk(s) exceed the 600KB threshold"
          else
            echo "All chunks are within the 600KB budget."
          fi

  build-server:
    name: Build (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build server
        run: npm run build --workspace=server

  test:
    name: Test (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run web tests
        run: npm run test --workspace=apps/web
