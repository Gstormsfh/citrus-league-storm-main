name: CI

# push is master-only. It used to be `branches: ['**']`, which together with the
# pull_request trigger ran every PR push twice under two different concurrency
# groups (ci-refs/heads/<branch> and ci-refs/pull/<n>/merge) -- double the
# minutes, and double what `gh pr checks --watch` had to wait on. PRs are still
# checked on every push through the pull_request event; master is checked on
# the squash commit itself.
on:
  push:
    branches: [master]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Branch freshness (advisory) ──────────────────────────────────────
  # Added 2026-09-02. On 2026-09-01 four PRs landed on master (#387-#390)
  # while twenty branches were open. #388 fixed a real calibration bug and
  # rewrote the three tests in test_projection_uncertainty.py that encode
  # it. Every branch cut before that carried the pre-#388 tests, so the
  # Data Pipeline Tests job failed the same three tests on every push, on
  # every one of those branches, for reasons none of them caused and none
  # of them could fix by their own content. Twenty branches, one root
  # cause, and nothing in the run said so -- the visible failure was an
  # assertion about scoring weights in a file the branch never opened.
  #
  # This job never fails. Its whole job is to put one sentence at the top
  # of the run that names the distance and the fix, so a red X below it is
  # legible in five seconds instead of an afternoon. Requiring branches to
  # be up to date is a branch-protection setting, not a workflow one; this
  # is the part CI can do.
  freshness:
    name: Branch Freshness (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The BRANCH TIP, not the pull_request merge ref. checkout's default
      # for a pull_request event is refs/pull/N/merge, which already
      # contains the base -- measuring distance from there always says
      # zero, which is exactly the blind spot this job exists to remove.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Report distance from base
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          set -uo pipefail
          git fetch --quiet origin "$BASE" || { echo "could not fetch $BASE"; exit 0; }
          BEHIND=$(git rev-list --count HEAD..origin/"$BASE")
          AHEAD=$(git rev-list --count origin/"$BASE"..HEAD)
          echo "ahead $AHEAD / behind $BEHIND (vs origin/$BASE)"

          {
            echo "### Branch freshness"
            echo
            echo "\`$AHEAD\` commit(s) ahead of \`$BASE\`, \`$BEHIND\` behind."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BEHIND" -eq 0 ]; then
            echo "Up to date with origin/$BASE."
            {
              echo
              echo "Up to date. Any failure in this run belongs to this branch."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The commits this branch is missing, and -- the part that matters
          # -- which of them touch files this branch never opened. A failing
          # check in one of THOSE is inherited, not caused here.
          MISSING=$(git log --oneline HEAD..origin/"$BASE")
          MERGE_BASE=$(git merge-base HEAD origin/"$BASE")
          git diff --name-only "$MERGE_BASE"..HEAD | sort -u > /tmp/mine.txt
          git diff --name-only "$MERGE_BASE"..origin/"$BASE" | sort -u > /tmp/theirs.txt
          comm -13 /tmp/mine.txt /tmp/theirs.txt > /tmp/untouched.txt
          N=$(grep -c . /tmp/untouched.txt || true)

          {
            echo
            echo "**Missing from this branch:**"
            echo
            printf '%s\n' "$MISSING" | sed 's/^/- /'
            echo
            if [ "${N:-0}" -gt 0 ]; then
              echo "\`$N\` file(s) changed on \`$BASE\` that this branch never opened."
              echo "A failing check in any of them is inherited, not caused here:"
              echo
              echo '```'
              head -40 /tmp/untouched.txt
              echo '```'
              echo
            fi
            echo "Fix: \`git fetch origin && git merge origin/$BASE\` (or rebase), then push."
            echo
            echo "See \`docs/RUNBOOKS/CI_RED_X_TRIAGE.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=Branch is $BEHIND commit(s) behind $BASE::Failures in this run may be inherited, not caused by this branch. Run: git fetch origin && git merge origin/$BASE"

  # ── Data pipeline (Python) ───────────────────────────────────────────
  # Added 2026-08-11. Before this, ci.yml ran ZERO Python: nine test files
  # under data-pipeline/tests had never gated anything, and three of them
  # could not even be imported.
  #
  # The one that mattered was test_nhl_season_year_parity.py, whose own
  # docstring says "the comment 'keep these in sync' is not a control; the
  # test is" — and which had been silently uncollectable because it put
  # data-pipeline on sys.path without importing _bootstrap to register the
  # data_pipeline package. Meanwhile the Python and TypeScript season rules
  # drifted from the schedule in exactly the way it was written to catch.
  #
  # test_slack_integration used to be deselected here: it patched
  # monitoring.alerting.requests, but _send_slack does `import requests` inside
  # the function body, so that attribute never existed and the test had never
  # passed. Repointed at requests.post, verified by fault injection (stubbing
  # _send_slack to return True without posting makes it fail), and the deselect
  # removed. The whole suite runs.
  python-tests:
    name: Data Pipeline Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt
          pip install pytest==8.3.4

      - name: pytest
        working-directory: data-pipeline
        shell: bash
        env:
          # The season-parity tests call the real SQL functions over PostgREST
          # rather than re-implementing them. Without these they self-skip.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pytest tests/ -q --no-header 2>&1 | tee /tmp/pytest.log

      # Every job ends with this step. It writes one row to public.ops_ci_runs
      # (Supabase, service-role only) so Claude can read the outcome through the
      # Supabase MCP -- the container cannot reach github.com, so without it a
      # CI result only reaches a session as a pasted log. `if: always()` runs it
      # on failure and cancellation; `continue-on-error` plus the action's own
      # exit-0 contract mean telemetry can never turn a job red. Test jobs tee
      # their runner output to a file (`shell: bash` sets pipefail, so the tee
      # cannot mask a failure) and pass it as log-file for the totals line.
      # Details: docs/RUNBOOKS/CI_TELEMETRY.md.
      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/pytest.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Only speaks up when pytest already failed. The 2026-09-01 case was
      # three assertions in test_projection_uncertainty.py -- in a file the
      # branch had never opened -- failing because the branch predated #388.
      # The distance itself is measured by the `freshness` job, which is
      # checked out at the branch tip; this step just makes sure nobody
      # reads a red pytest without being told that job exists.
      - name: Where to look first
        if: failure()
        run: |
          echo "::notice title=Check Branch Freshness before this failure::If the 'Branch Freshness (advisory)' job in this run reports commits behind the base, these failures may be inherited -- #388 rewrote the tests in test_projection_uncertainty.py. See docs/RUNBOOKS/CI_RED_X_TRIAGE.md."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: cd apps/web && npx eslint src/

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  typecheck:
    name: Type Check (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ratchet, not a gate. `vite build` does not typecheck, so these errors
      # ship. The rule this replaces was `|| echo "::warning::"`, which ran every
      # build green and taught everyone to scroll past it -- the same
      # permanently-amber failure mode removed from the DB monitors.
      #
      # This fails only when the count GOES UP, so the debt can be paid down
      # incrementally instead of red-walling every PR. The threshold lives in
      # apps/web/.typecheck-baseline and is a MEASUREMENT of this tree, taken by
      # running the same command below -- never a number carried over from
      # another branch. Read that file's header before changing it.
      - name: TypeScript compile check (web) - ratchet
        run: |
          cd apps/web
          BASELINE=$(grep -oE '^[0-9]+' .typecheck-baseline | head -1)
          if [ -z "$BASELINE" ]; then
            echo "::error::apps/web/.typecheck-baseline has no numeric baseline."
            exit 1
          fi
          npx tsc --noEmit -p tsconfig.app.json 2>&1 | tee /tmp/tsc-web.log || true
          COUNT=$(grep -c "error TS" /tmp/tsc-web.log || true)
          COUNT=${COUNT:-0}
          echo "type errors: $COUNT (baseline $BASELINE)" | tee /tmp/tsc-web.summary
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Web type errors rose from $BASELINE to $COUNT. New errors:"
            grep "error TS" /tmp/tsc-web.log | head -40
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Web type errors fell from $BASELINE to $COUNT - lower apps/web/.typecheck-baseline to $COUNT to lock the win in."
          fi

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/tsc-web.summary
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  typecheck-server:
    name: Type Check (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript compile check (server)
        shell: bash
        run: cd server && npx tsc --noEmit 2>&1 | tee /tmp/tsc-server.log

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/tsc-server.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build:
    name: Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Production build (web)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build --workspace=apps/web

      - name: Bundle size check (600KB per chunk)
        run: |
          echo "=== Bundle Size Report ==="
          oversized=0
          for file in apps/web/dist/assets/*.js; do
            [ -f "$file" ] || continue
            size=$(stat --format=%s "$file")
            size_kb=$((size / 1024))
            name=$(basename "$file")
            if [ "$size_kb" -gt 600 ]; then
              echo "::warning file=$file::Chunk $name is ${size_kb}KB (exceeds 600KB limit)"
              oversized=$((oversized + 1))
            else
              echo "  OK  $name — ${size_kb}KB"
            fi
          done
          echo ""
          if [ "$oversized" -gt 0 ]; then
            echo "::warning::$oversized chunk(s) exceed the 600KB threshold"
          else
            echo "All chunks are within the 600KB budget."
          fi

      # Hard PNG budget gate — regression check for LIVE_DRAFT_DISASTER §7.
      #
      # On April 10 2026 the production build shipped 5.1 MB of unused Gemini
      # mockup PNGs because Vite bundled every PNG referenced by any import,
      # including ones reachable only from dead code. `npm run build` stayed
      # green and nobody checks the bundle report after a deploy, so the bloat
      # survived until a live draft hit it during a 10-deploy afternoon and
      # every CDN cache miss multiplied the damage.
      #
      # Scope: `dist/assets/**/*.png`. This is the directory Vite writes
      # IMPORT-bundled PNGs to (with content-hash filenames). The postmortem
      # §7 fix is specifically about import-bundled PNGs — static public/
      # files land at `dist/*.png` and are a separate category (PWA icons
      # live there). Narrowing the gate here avoids false-positive failures
      # on PWA assets while still catching the exact regression §7 describes.
      #
      # Budget: 512 KB total (per postmortem P2 action item).
      # Failure mode: HARD exit 1, not a warning — the existing JS step above
      # is advisory, this one is not. A warning would not have caught April 10.
      - name: Dist PNG budget gate (dist/assets/**/*.png ≤ 512 KB)
        run: |
          set -euo pipefail
          BUDGET_BYTES=$((512 * 1024))
          dist_dir="apps/web/dist/assets"

          if [ ! -d "$dist_dir" ]; then
            echo "::error::Expected $dist_dir to exist after build step"
            exit 1
          fi

          # Sum bytes across every PNG Vite bundled into dist/assets.
          total=0
          count=0
          while IFS= read -r -d '' file; do
            size=$(stat --format=%s "$file")
            total=$((total + size))
            count=$((count + 1))
          done < <(find "$dist_dir" -type f -name '*.png' -print0)

          total_kb=$((total / 1024))
          budget_kb=$((BUDGET_BYTES / 1024))

          echo "=== Dist PNG Budget Report ==="
          echo "Scope:  $dist_dir/**/*.png"
          echo "Files:  $count"
          echo "Total:  ${total_kb} KB"
          echo "Budget: ${budget_kb} KB"
          echo ""

          if [ "$total" -gt "$BUDGET_BYTES" ]; then
            echo "::error::dist/assets PNGs total ${total_kb} KB, exceeds ${budget_kb} KB budget"
            echo ""
            echo "Top 5 largest PNGs in $dist_dir:"
            # Print size (bytes)  path, sorted descending, take first 5.
            find "$dist_dir" -type f -name '*.png' -printf '%s  %p\n' \
              | sort -nr \
              | head -5 \
              | awk '{ printf "  %8d bytes  %s\n", $1, $2 }'
            echo ""
            echo "See docs/LIVE_DRAFT_DISASTER_POSTMORTEM.md §7 for context."
            exit 1
          fi

          echo "PASS — dist PNGs within budget."

      # Hard total-bundle gzipped budget — extends the PNG gate to cover
      # every file in dist/. Postmortem P2: `dist/**` ≤ 5 MB gzipped.
      #
      # Why gzipped: the browser downloads the gzipped payload over the
      # wire, so that's the number that actually hits the user's connection
      # and Firebase's egress bill. A 3.38 MB PNG directory is 3.38 MB on
      # disk AND on the wire because PNGs are already compressed — but a
      # 2 MB JS bundle might compress to 400 KB. Measuring gzipped gives a
      # fair budget across file types.
      #
      # Failure mode: HARD exit 1. The existing PNG gate catches the
      # specific April 10 regression (image bloat); this gate catches
      # the broader "we shipped a giant bundle" category.
      - name: Dist total gzipped budget (dist/** ≤ 5 MB gzipped)
        run: |
          set -euo pipefail
          BUDGET_BYTES=$((5 * 1024 * 1024))
          dist_dir="apps/web/dist"

          if [ ! -d "$dist_dir" ]; then
            echo "::error::Expected $dist_dir to exist after build step"
            exit 1
          fi

          # Sum gzipped bytes across every file in dist/. Skip files that
          # don't benefit from gzip (already-compressed PNG/JPG/WOFF2) —
          # for those, count raw size since the browser won't re-compress.
          total=0
          count=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.png|*.jpg|*.jpeg|*.webp|*.woff|*.woff2|*.gz|*.br|*.ico)
                size=$(stat --format=%s "$file")
                ;;
              *)
                size=$(gzip -c -9 "$file" | wc -c)
                ;;
            esac
            total=$((total + size))
            count=$((count + 1))
          done < <(find "$dist_dir" -type f -print0)

          total_kb=$((total / 1024))
          budget_kb=$((BUDGET_BYTES / 1024))

          echo "=== Dist Total Gzipped Budget Report ==="
          echo "Scope:  $dist_dir/**"
          echo "Files:  $count"
          echo "Total:  ${total_kb} KB gzipped"
          echo "Budget: ${budget_kb} KB gzipped"
          echo ""

          if [ "$total" -gt "$BUDGET_BYTES" ]; then
            echo "::error::dist/** totals ${total_kb} KB gzipped, exceeds ${budget_kb} KB budget"
            echo ""
            echo "Top 10 largest files in $dist_dir (raw bytes):"
            find "$dist_dir" -type f -printf '%s  %p\n' \
              | sort -nr \
              | head -10 \
              | awk '{ printf "  %10d bytes  %s\n", $1, $2 }'
            echo ""
            echo "See docs/LIVE_DRAFT_DISASTER_POSTMORTEM.md P2 for context."
            exit 1
          fi

          echo "PASS — dist total within gzipped budget."

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build-server:
    name: Build (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build server
        run: npm run build --workspace=server

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  test:
    name: Test (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run web tests
        shell: bash
        run: npm run test --workspace=apps/web 2>&1 | tee /tmp/test-web.log

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/test-web.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  test-server:
    name: Test (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run server tests
        shell: bash
        run: npm run test --workspace=server 2>&1 | tee /tmp/test-server.log

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/test-server.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Contract tests for the repo's operational scripts (scripts/**/*.test.mjs).
  # node:test only, no npm ci: they must stay dependency-free so they run
  # anywhere node does. The first one pins scripts/delivery/land-bundle.ps1
  # (refspec fetch, never a checkout, refuses master, $LASTEXITCODE after every
  # git/gh call) -- PowerShell cannot run on this runner, so the script is
  # checked as text.
  test-scripts:
    name: Test (Scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run script contract tests
        shell: bash
        run: npm run test:scripts 2>&1 | tee /tmp/test-scripts.log

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/test-scripts.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Added 2026-09-01. The six suites under packages/shared/src/**/__tests__
  # were run by nothing: the package had no `test` script, the web and server
  # vitest configs only include their own `src/**`, and no job here ran them.
  # One of them (leagueTimeline.test.ts) had been failing since the 2026-08-24
  # launch build and nobody saw it. Same shape as "Test (Web)" above.
  test-shared:
    name: Test (Shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run shared tests
        shell: bash
        run: npm run test --workspace=packages/shared 2>&1 | tee /tmp/test-shared.log

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/test-shared.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── Generated scoring defaults ───────────────────────────────────────
  # packages/shared/src/constants/scoringDefaults.json is the one source of
  # the default scoring weights. scripts/gen-scoring-defaults.mjs derives the
  # Python module (data-pipeline/scoring/scoring_defaults.py) and the docs
  # table (docs/generated/SCORING_DEFAULTS.md) from it. This job regenerates
  # both and fails on any diff, so a JSON edit without a regenerate — or a
  # hand edit to a generated file — cannot merge. Plain Node, no npm ci.
  scoring-defaults:
    name: Generated Scoring Defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate from the JSON source
        run: npm run gen:scoring

      - name: Generated files must match the committed ones
        run: |
          GENERATED="data-pipeline/scoring/scoring_defaults.py docs/generated/SCORING_DEFAULTS.md"
          # --porcelain also lists an untracked file, which a plain
          # `git diff --exit-code` would miss if a generated file were deleted.
          if [ -n "$(git status --porcelain -- $GENERATED)" ]; then
            git --no-pager diff -- $GENERATED
            echo "::error::Generated scoring defaults are stale. Run 'npm run gen:scoring' and commit the result."
            exit 1
          fi
          echo "Generated scoring defaults are fresh."

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 so the SQL-content check below can diff against the base
      # and look at the migrations THIS PR adds, rather than re-warning about
      # every migration ever written.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate migration file naming
        run: |
          echo "=== Migration Naming Validation ==="
          errors=0
          for file in supabase/migrations/*.sql; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if ! echo "$name" | grep -qE '^[0-9]{14}_[a-zA-Z0-9_]+\.sql$'; then
              echo "::error file=$file::Invalid migration name: $name (expected YYYYMMDDHHMMSS_description.sql)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors migration(s) have invalid naming"
            exit 1
          fi
          echo "All migrations follow naming convention."

      - name: Check for duplicate timestamps
        run: |
          echo "=== Duplicate Timestamp Check ==="
          timestamps=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -I{} basename {} | cut -c1-14 | sort)
          dupes=$(echo "$timestamps" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration timestamps found: $dupes"
            exit 1
          fi
          echo "No duplicate timestamps found."

      - name: Validate SQL syntax (basic)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "=== Basic SQL Validation ==="
          errors=0
          # CHANGED FILES ONLY (2026-09-03). This walked every migration in the
          # repo on every run, so five DROP TABLE CASCADE warnings fired forever
          # on files from 2025-12 through 2026-08 that are already applied to
          # production and cannot be edited. A warning nobody can action, on
          # every run, is how this job's real output got lost in its own noise.
          # New and modified migrations still get the full check; the naming and
          # duplicate-timestamp checks above still scan everything, because those
          # are cheap and a rename genuinely can break the ordering.
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only --diff-filter=d "${BASE_SHA}...HEAD" -- 'supabase/migrations/*.sql' || true)
            echo "Scanning migrations changed since ${BASE_SHA}."
          else
            FILES=$(ls supabase/migrations/*.sql 2>/dev/null || true)
            echo "No PR base available (push build) -- scanning all migrations."
          fi
          if [ -z "$FILES" ]; then
            echo "No migration files to check."
          fi
          for file in $FILES; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            # Check for common SQL issues
            if grep -qiP 'DROP\s+TABLE.*CASCADE' "$file" 2>/dev/null; then
              echo "::warning file=$file::$name contains DROP TABLE CASCADE — verify this is intentional"
            fi
            # Check SECURITY DEFINER functions have SET search_path (ignore comments and string literals)
            if grep -i 'SECURITY DEFINER' "$file" | grep -v '^\s*--' | grep -qv 'RAISE\|NOTICE\|COMMENT'; then
              if ! grep -qi 'SET search_path' "$file"; then
                echo "::error file=$file::$name has SECURITY DEFINER without SET search_path = public"
                errors=$((errors + 1))
              fi
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors migration(s) have security issues"
            exit 1
          fi
          echo "All migrations pass basic validation."

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit (high/critical vulnerabilities)
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities — review before next release"

      - name: Check for hardcoded secrets
        run: |
          echo "=== Secret Pattern Scan ==="
          errors=0
          # Scan source files for common secret patterns
          for dir in apps/web/src server/src packages/shared/src; do
            [ -d "$dir" ] || continue
            # API keys, tokens, passwords in string literals
            if grep -rn --include="*.ts" --include="*.tsx" \
              -E "(sk_live_|pk_live_|ghp_|gho_|xoxb-|xoxp-|AKIA[A-Z0-9]{16})" "$dir" 2>/dev/null; then
              echo "::error::Potential hardcoded secret found in $dir"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Check for console.log in production code
        run: |
          echo "=== Console.log Audit ==="
          violations=0
          for dir in apps/web/src server/src packages/shared/src; do
            [ -d "$dir" ] || continue
            # Find console.log in non-test, non-config files
            # structuredLogger.ts is excluded for the same reason logger.ts is:
            # it IS the logger. Its own header says "the internal console.* use
            # here is the ONLY permitted console.* call site", and every call
            # carries an eslint-disable. Flagging it is a permanent false
            # positive, and a scan that always fires teaches people to ignore
            # every line it prints -- including the real one.
            #
            # deriveDraftState.ts is excluded deliberately, and this is the one
            # exemption that is a judgement call rather than an obvious false
            # positive. Its two `console.debug` calls are guarded browser
            # diagnostics ("absorbing terminal state", "unknown event kind") in
            # the client-side draft reducer. `logger` from @citrus/shared is a
            # NOOP in the web app -- only server/src/index.ts and
            # server/src/draft/index.ts call createConsoleLogger() -- so
            # "fixing" this by swapping in logger.debug does not route the
            # message anywhere, it deletes it. Those two lines are the most
            # useful diagnostic in the draft client when a room misbehaves, and
            # trading them for a green scan would be optimising the metric
            # against the thing the metric is for. Revisit if the web app ever
            # wires up a real logger.
            #
            # The last two greps drop JSDoc prose (` * 4. Emits via console.log`)
            # and the defensive guard `typeof console.debug === 'function'`.
            # Neither is a call site.
            matches=$(grep -rn "console\.\(log\|debug\|info\)" "$dir" \
              --include="*.ts" --include="*.tsx" \
              --exclude-dir="__tests__" \
              --exclude="logger.ts" --exclude="structuredLogger.ts" \
              --exclude="deriveDraftState.ts" \
              --exclude="vite-env.d.ts" \
              --exclude="requestContext.ts" --exclude="app.ts" \
              2>/dev/null \
              | grep -v "// " | grep -v "test" \
              | grep -vE ':[[:space:]]*\*' \
              | grep -vE "typeof console" || true)
            if [ -n "$matches" ]; then
              echo "$matches" | while read -r line; do
                echo "::warning::$line"
              done
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found console.log usage — prefer logger from @citrus/shared"
          fi
          echo "Console.log audit complete."

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
