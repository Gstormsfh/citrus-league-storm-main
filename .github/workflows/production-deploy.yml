name: Production Deploy

on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false  # Never cancel production deploys

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Gate: all checks must pass before deploy ──────────────────────────
  gate:
    name: Pre-deploy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Change freeze guard ─────────────────────────────────────────
      # Blocks production deploys within 24 hours of any scheduled live
      # draft. See docs/LIVE_DRAFT_DISASTER_POSTMORTEM.md §4 — ten deploys
      # in 2.5 hours before the inaugural draft is how a combination of
      # latent bugs became a production incident.
      #
      # Emergency bypass: set OVERRIDE_DRAFT_FREEZE=1 in the workflow env.
      # Must be justified in the commit message.
      - name: Change freeze guard (24h before any scheduled draft)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OVERRIDE_DRAFT_FREEZE: ${{ vars.OVERRIDE_DRAFT_FREEZE }}
        run: npx tsx scripts/check_draft_freeze.ts

      - name: Lint
        run: cd apps/web && npx eslint src/

      # Same ratchet as ci.yml (that copy is canonical; keep the two identical).
      # This step was `|| echo "::warning::"` until 2026-09-01, so a PR that
      # passed the CI ratchet could still not regress here -- but a direct push
      # to master could, and the warning ran green either way. Fails only when
      # the count GOES UP relative to apps/web/.typecheck-baseline; read that
      # file's header before changing it.
      - name: TypeScript compile check (web) - ratchet
        run: |
          cd apps/web
          BASELINE=$(grep -oE '^[0-9]+' .typecheck-baseline | head -1)
          if [ -z "$BASELINE" ]; then
            echo "::error::apps/web/.typecheck-baseline has no numeric baseline."
            exit 1
          fi
          npx tsc --noEmit -p tsconfig.app.json 2>&1 | tee /tmp/tsc-web.log || true
          COUNT=$(grep -c "error TS" /tmp/tsc-web.log || true)
          COUNT=${COUNT:-0}
          echo "type errors: $COUNT (baseline $BASELINE)" | tee /tmp/tsc-web.summary
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Web type errors rose from $BASELINE to $COUNT. New errors:"
            grep "error TS" /tmp/tsc-web.log | head -40
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Web type errors fell from $BASELINE to $COUNT - lower apps/web/.typecheck-baseline to $COUNT to lock the win in."
          fi

      - name: Type check (server)
        run: cd server && npx tsc --noEmit

      - name: Build shared
        run: npm run build --workspace=packages/shared

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # VITE_API_URL intentionally omitted — Firebase Hosting rewrites
          # /api/* to Cloud Run, so the frontend uses same-origin requests.
          # Setting this to a separate domain would bypass the rewrite.
        run: npm run build --workspace=apps/web

      - name: Build server
        run: npm run build --workspace=server

      - name: Run web tests
        run: npm run test --workspace=apps/web

      - name: Run server tests
        run: npm run build --workspace=packages/shared && npm run test --workspace=server

      - name: Security audit (high/critical only)
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities — review before next release"

      - name: Bundle size check
        run: |
          oversized=0
          for file in apps/web/dist/assets/*.js; do
            [ -f "$file" ] || continue
            size=$(stat --format=%s "$file")
            size_kb=$((size / 1024))
            if [ "$size_kb" -gt 600 ]; then
              echo "::warning::$(basename $file) is ${size_kb}KB (>600KB)"
              oversized=$((oversized + 1))
            fi
          done
          if [ "$oversized" -gt 0 ]; then
            echo "::warning::$oversized oversized chunk(s)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist/
          retention-days: 7

      # Every job ends with this step: one row in public.ops_ci_runs so Claude
      # can read the deploy outcome through the Supabase MCP without a pasted
      # log. Never fails the job (if: always() + continue-on-error + the
      # action exits 0). See docs/RUNBOOKS/CI_TELEMETRY.md.
      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/tsc-web.summary
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── Deploy API server to Cloud Run ──────────────────────────────────
  deploy-api:
    name: Deploy API to Cloud Run
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v5

      # A production deploy that deploys nothing must not be green.
      #
      # This step used to emit a ::notice:: and set has_creds=false, which made
      # every following step skip and the job report success. The whole point of
      # the verification steps below — added after 2026-08-24, when Cloud Run
      # served a stale revision for 12.6h behind a "successful" deploy — is that
      # a deploy which did not take effect fails loudly. A missing credential is
      # the same failure with a shorter path: master moves, the web bundle
      # ships, the API does not, and nothing says so.
      #
      # has_creds is kept rather than deleted so the `if:` guards below still
      # read correctly, but the false branch now stops the job.
      - name: Check GCP credentials
        id: check-gcp
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::error::GCP_SA_KEY is not configured, so the API was NOT deployed. The web bundle would have shipped against an API running older code. Set the secret, or disable this job deliberately."
            exit 1
          fi
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud
        if: steps.check-gcp.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check-gcp.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.check-gcp.outputs.has_creds == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        if: steps.check-gcp.outputs.has_creds == 'true'
        run: |
          IMAGE="us-central1-docker.pkg.dev/citrus-fantasy-prod/citrus-api/server:${{ github.sha }}"
          LATEST="us-central1-docker.pkg.dev/citrus-fantasy-prod/citrus-api/server:latest"
          docker build -t "$IMAGE" -t "$LATEST" -f Dockerfile .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        if: steps.check-gcp.outputs.has_creds == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: citrus-api
          region: us-central1
          image: us-central1-docker.pkg.dev/citrus-fantasy-prod/citrus-api/server:${{ github.sha }}
          # ── env_vars IS A YAML LITERAL BLOCK — NO COMMENTS INSIDE IT ──
          #
          # Everything under `env_vars: |` is raw text, not YAML. A line
          # starting with `#` is NOT a comment there: deploy-cloudrun
          # splits the block on newlines and hands each line to
          # `--update-env-vars`, so a comment becomes a garbage variable
          # and — because the delimiter is `^,^` — the `,` and `=` inside
          # the prose shred the surrounding real entries too.
          #
          # That is exactly what happened on 2026-08-24 (chunk 11g.9): six
          # comment lines added here produced entries like
          #   `  Chunk 11g.9: Stormy moved off the Edge Function=`
          # which swallowed SUPABASE_SERVICE_ROLE_KEY and left
          # ANTHROPIC_API_KEY empty. The revision failed to become ready,
          # the job still reported success, and prod silently kept serving
          # the previous image for 12+ hours while the web bundle moved on
          # — taking Stormy down. Keep this block to KEY=VALUE lines only.
          #
          # Chunk 11g.9: Stormy runs on the API server now, so the
          # Anthropic key has to reach Cloud Run. Setting it here keeps it
          # reproducible from the repo; the deploy uses --update-env-vars,
          # so it merges rather than replacing the service environment.
          #
          # Chunk: APNs. PushService.loadApnsConfigFromEnv() returns null
          # unless APNS_KEY_ID, APNS_TEAM_ID and APNS_PRIVATE_KEY are all
          # present, and a null config leaves the service dormant — draft
          # "on the clock" pushes silently never send and nothing errors.
          # So the three have to reach Cloud Run, not just exist as repo
          # secrets.
          #
          # Safe to merge before the secrets exist. An unset secret
          # interpolates to an empty string, `KEY=` sets an empty value
          # rather than unsetting (that is what --remove-env-vars is for),
          # and loadApnsConfigFromEnv treats empty as absent and returns
          # null. Same dormant state as today, no startup failure.
          #
          # APNS_PRODUCTION=true selects api.push.apple.com. TestFlight and
          # App Store builds carry production device tokens; a build
          # installed straight from Xcode carries a sandbox token, which
          # production APNs rejects and PushService.pruneToken then deletes
          # from device_tokens. Test on TestFlight, not a debug install.
          #
          # DRAFT_WS_HOST / DRAFT_WS_PORT (2026-09-03). These tell the browser
          # where the draft engine lives: `GET /api/drafts/:id/server` returns
          # them verbatim (server/src/routes/drafts.ts:151) and the client
          # builds `wss://<host>:<port>/ws/draft/<id>` from the answer.
          #
          # They were set by hand in the Cloud Run console and declared in NO
          # repo-tracked file, which made two failures possible and neither
          # visible. First, `DRAFT_WS_HOST` falls back to `localhost`, so an
          # unset value returns HTTP 200 carrying `wss://localhost:3002` and
          # every manager's browser fails to connect, forever, while every
          # server-side signal stays green. Second, the pre-draft checklist's
          # own remediation is `gcloud run services replace`, which is
          # declarative and DELETES any variable the file omits.
          #
          # LITERALS, NOT `vars.*` (2026-09-03, corrected within the hour).
          #
          # These first shipped as `${{ vars.DRAFT_WS_HOST }}`. No such
          # repository variable existed, and GitHub renders a missing `vars.*`
          # as the EMPTY STRING rather than failing the workflow, so the very
          # deploy that added them set `DRAFT_WS_HOST=` and
          # `process.env.DRAFT_WS_HOST || 'localhost'` fell straight through
          # to localhost. The change written to prevent the outage caused it.
          #
          # A hostname and a port are not secrets, so indirection bought
          # nothing and cost the one property that mattered: being unable to
          # be empty. ops/cloudrun/service.yaml already carried literals; the
          # two files now agree, and deployConfig.test.ts asserts the host
          # here is one firebase.json's connect-src permits.
          #
          # Changing engines is now a tracked one-line PR, which is the
          # correct weight for a change that repoints every draft room.
          #
          # These comments are deliberately ABOVE `env_vars: |` and not
          # inside it. See the 2026-08-24 note below.
          env_vars: |
            NODE_ENV=production
            SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            APNS_KEY_ID=${{ secrets.APNS_KEY_ID }}
            APNS_TEAM_ID=${{ secrets.APNS_TEAM_ID }}
            APNS_PRIVATE_KEY=${{ secrets.APNS_PRIVATE_KEY }}
            APNS_PRODUCTION=true
            DRAFT_WS_HOST=draft.citrusfantasysports.com
            DRAFT_WS_PORT=443
          # ── Cloud Run scaling config ────────────────────────────────
          # These flags MUST stay in sync with ops/cloudrun/service.yaml.
          # The April 10 disaster (LIVE_DRAFT_DISASTER_POSTMORTEM.md §3)
          # was caused by the default values below (512Mi, maxScale=3,
          # minScale=0) — cold start + three-instance cap + half a gig of
          # RAM under 12-owner live-draft fan-out hit 429/503 territory
          # immediately. Every push to master was silently resetting the
          # service back to these disaster values. Never downgrade.
          flags: >-
            --allow-unauthenticated
            --memory=2Gi
            --cpu=2
            --min-instances=1
            --max-instances=10
            --concurrency=80
            --timeout=60s
            --no-cpu-throttling
            --cpu-boost

      # Prove the revision we just built is the one serving traffic.
      # Without this the job can go green while Cloud Run silently keeps
      # the previous revision (2026-08-24: 12.6h of unbroken uptime behind
      # a "successful" deploy). Fail loudly instead.
      - name: Verify serving revision is this build
        if: steps.check-gcp.outputs.has_creds == 'true'
        run: |
          set -euo pipefail
          # Read the image off the revision ACTUALLY SERVING TRAFFIC, not off
          # spec.template — the spec updates the moment the deploy is accepted,
          # even when the new revision never becomes ready and traffic stays on
          # the old one. Checking spec here would pass in exactly the failure
          # this step exists to catch (2026-08-24: first version of this guard
          # did precisely that and reported green over a stale revision).
          SERVING=$(gcloud run services describe citrus-api \
            --region=us-central1 \
            --format='value(status.traffic[0].revisionName)')
          LATEST_READY=$(gcloud run services describe citrus-api \
            --region=us-central1 \
            --format='value(status.latestReadyRevisionName)')
          LATEST_CREATED=$(gcloud run services describe citrus-api \
            --region=us-central1 \
            --format='value(status.latestCreatedRevisionName)')
          SERVING_IMAGE=$(gcloud run revisions describe "$SERVING" \
            --region=us-central1 \
            --format='value(spec.containers[0].image)')

          echo "serving revision : $SERVING"
          echo "latest ready     : $LATEST_READY"
          echo "latest created   : $LATEST_CREATED"
          echo "serving image    : $SERVING_IMAGE"

          if [ "$LATEST_CREATED" != "$LATEST_READY" ]; then
            echo "::error::Revision $LATEST_CREATED was created but never became ready. Cloud Run is still serving $SERVING. Check the revision logs."
            exit 1
          fi
          # Cloud Run pins a deployed image by DIGEST, so the serving image
          # comes back as `...server@sha256:<hex>` rather than carrying the
          # `:<git-sha>` tag we pushed. The original check stripped to the
          # last colon, which on a digest yields the sha256 hex — a value
          # that can never equal a commit SHA. Result: this step failed
          # EVERY deploy while the deploy itself had succeeded (2026-08-25:
          # serving, latestReady and latestCreated all agreed on the new
          # revision, /api/news served the new build, and the job still went
          # red — which then skipped the web deploy entirely).
          #
          # Compare digest-to-digest when a digest is what we are handed, and
          # keep the tag comparison for the case where it isn't.
          if [[ "$SERVING_IMAGE" == *"@sha256:"* ]]; then
            SERVING_DIGEST="${SERVING_IMAGE##*@}"
            EXPECTED_DIGEST=$(gcloud artifacts docker images describe "$IMAGE" \
              --format='value(image_summary.digest)' 2>/dev/null || true)
            echo "serving digest   : $SERVING_DIGEST"
            echo "expected digest  : $EXPECTED_DIGEST"
            if [ -z "$EXPECTED_DIGEST" ]; then
              echo "::error::Could not resolve a digest for $IMAGE — cannot prove which build is serving."
              exit 1
            fi
            if [ "$SERVING_DIGEST" != "$EXPECTED_DIGEST" ]; then
              echo "::error::Traffic is on digest $SERVING_DIGEST, expected $EXPECTED_DIGEST. The deploy did not take effect."
              exit 1
            fi
          elif [ "${SERVING_IMAGE##*:}" != "${{ github.sha }}" ]; then
            echo "::error::Traffic is on image tag ${SERVING_IMAGE##*:}, expected ${{ github.sha }}. The deploy did not take effect."
            exit 1
          fi
          echo "Serving revision $SERVING is running this build." | tee /tmp/deploy-api.summary

      - name: API health check
        if: steps.check-gcp.outputs.has_creds == 'true'
        run: |
          API_URL=$(gcloud run services describe citrus-api --region=us-central1 --format='value(status.url)' 2>/dev/null) || true
          if [ -n "$API_URL" ]; then
            echo "Checking $API_URL/api/health..."
            sleep 10
            status=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/api/health" --max-time 10) || true
            if [ "$status" = "200" ]; then
              echo "API health check passed (HTTP $status)"
            else
              echo "::warning::API health check returned HTTP $status"
            fi
          fi

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/deploy-api.summary
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── Deploy Supabase Edge Functions — REMOVED (chunk 11g.9) ─────────
  # This job deployed `stormy-chat` on every push to master. Stormy now
  # lives at POST /api/stormy/chat on the API server (deploy-api above),
  # and supabase/functions/stormy-chat no longer exists — leaving the job
  # in place would fail the deploy on the next push.
  #
  # Nothing replaces this job: there are no Edge Functions left to deploy.

  # ── Deploy frontend to Firebase Hosting ─────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [gate, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist/

      - name: Check Firebase credentials
        id: check-creds
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — FIREBASE_SERVICE_ACCOUNT not configured"
          fi
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: citrus-fantasy-prod
          channelId: live

      - name: Post-deploy health check
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          echo "Waiting 15s for deploy propagation..."
          sleep 15
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://citrusfantasysports.com/" --max-time 10) || true
          if [ "$status" = "200" ]; then
            echo "Health check passed (HTTP $status)" | tee /tmp/deploy-web.summary
          else
            echo "::warning::Health check returned HTTP $status — verify manually"
            echo "Health check returned HTTP $status" > /tmp/deploy-web.summary
          fi

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/deploy-web.summary
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── Notify team ───────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Production deploy successful for ${{ github.sha }}"
          else
            echo "::error::Production deploy failed — investigate immediately"
          fi

      # This job is always green; the row carries the DEPLOY job's result so
      # "did master ship?" is one query: workflow='Production Deploy', job='notify'.
      - uses: actions/checkout@v5

      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ needs.deploy.result }}
          summary: production deploy ${{ needs.deploy.result }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
