name: Draft Kit Renderer

on:
  pull_request:
    paths:
      - 'scripts/draft-guide/**'
      - 'packages/shared/**'
      - 'scripts/ops/package_draft_kit_review.py'
      - 'scripts/ops/verify_draft_downloads.mts'
      - 'server/Dockerfile.draft-kit'
      - '.github/workflows/draft-kit-renderer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-contracts:
    name: Draft Kit Renderer Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/draft-guide/requirements-delivery.txt
      - name: Install renderer and shared-scoring dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r scripts/draft-guide/requirements-delivery.txt
      - name: Source, horizon, asset and PDF contracts
        working-directory: scripts/draft-guide
        run: >-
          python -m unittest
          test_canonical_import test_preseason_horizon test_offline_portraits
          test_photo_rights test_pdf_navigation
          test_editorial_bundle_isolation
      - name: Offline comparison and delivery contracts
        run: |
          node --test scripts/draft-guide/test_compare.cjs scripts/ops/draft-kit-runtime/deploy-contract.test.mjs
          python -m unittest discover -s scripts/ops/draft-kit-runtime -p 'test_*.py'
      # Private authored editions and licensed photographs are deliberately
      # absent. Full five-format acceptance runs against a separately supplied,
      # immutable private bundle before deployment; CI cannot approve an edition.
