name: Shot Coverage Reconciler (daily)

# Daily gap-detection + auto-heal for the three coverage gap classes
# surfaced by Phase 0b (see apps/web/docs/PHASE_0B_DIAGNOSTIC.md and
# docs/OPERATIONS_RUNBOOK.md):
#
#   no_payload    — nhl_games says final, raw_nhl_data has no row.
#   stale_payload — payload cached mid-game/pre-game, gameState not terminal.
#   no_shots      — payload OK but raw_shots has zero rows (extraction failed).
#
# Runs at 11:00 UTC (after latest West Coast OT wraps, before US morning).
# Fails the workflow (GitHub email alert) on any heal failure OR on cap-
# exceeded (>15 gaps at once = structural outage, humans investigate first).
# Same failure-as-alert-channel pattern as playoff-reconciliation.yml.

on:
  schedule:
    - cron: '0 11 * * *'  # daily 11:00 UTC
  workflow_dispatch: {}   # manual trigger for testing

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - run: pip install -r data-pipeline/requirements.txt

      # No continue-on-error — non-zero exit MUST fail the workflow so
      # GitHub emails on the failure. That's the primary alert channel.
      # --env-file: use the repo-root .env which the workflow builds from
      # the env vars above (avoids repointing the reconciler at another file).
      - name: Materialize .env from workflow secrets
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
          } > .env

      - name: Reconcile shot coverage (heal up to 15)
        run: |
          python data-pipeline/monitoring/reconcile_shot_coverage.py \
            --heal --max-heal 15 --env-file .env
