name: Injury Status Sync

# Populates player_talent_metrics.roster_status / is_ir_eligible, which drive
# the IR slot (Roster.tsx gates every IR assignment on is_ir_eligible) and the
# player news feed (usePlayerNews filters on roster_status).
#
# WHY THIS WORKFLOW EXISTS AT ALL
# ────────────────────────────────
# On 2026-08-26 roster_status was NULL for all 940 rows, so both features were
# inert — built, wired, and silently never working since the column was added
# in January.
#
# The obvious diagnosis was "nobody scheduled the populator", and it was wrong.
# scripts/utilities/populate_gp_last_10_metric.py called
# https://api-web.nhle.com/v1/roster/{team}/current and read
# `status` / `rosterStatus` / `roster_status`. Verified against the live
# endpoint: that payload carries none of those keys — it is biographical only
# (id, headshot, names, sweaterNumber, positionCode, height, weight, birth).
# /v1/player/{id}/landing carries `isActive`, which is career-active and not
# injury. The NHL's public API publishes no injury or IR designation anywhere.
#
# Scheduling that script would have run 32 fetches a night, updated zero rows,
# and reported success — a green job doing nothing, which is the failure mode
# this repo has paid for more than once.
#
# So status comes from an external feed instead. See the module docstring in
# fetch_injury_status.py for the source, its limits, and why licensing a
# proper feed (SportsDataIO, Rotowire) is the durable answer.
#
# CADENCE
# ───────
# Every 6 hours, ONCE ENABLED. IR and LTIR designations move on a daily
# rhythm, not a minute-by-minute one, so 6h bounds staleness well inside the
# window that matters for setting a lineup. Load is one HTTP request per run.
#
# NOT covered by this cadence, and not covered by this feed: game-day
# scratches and starting-goalie confirmations, which land 1-2 hours before
# puck drop and are a separate source. Do not tighten this cron expecting to
# catch them — it will not.
#
# THE SCHEDULE IS DELIBERATELY OFF AT MERGE
# ──────────────────────────────────────────
# Every write in this job references player_talent_metrics.roster_status_source,
# which migration 20260827030000 adds and which does NOT exist in production
# yet — migrations are frozen pending the reconciliation (Track B). A cron
# merged in this state fails every six hours from the moment it lands until
# the migration is applied.
#
# That is not a cosmetic problem. A scheduled job that is permanently red
# teaches everyone to ignore red, and this repo has already paid for that
# once: the deploy that was green while deploying nothing went unnoticed
# because nobody reads a wall of failures. Shipping the cron ahead of its
# column would rebuild exactly that habit.
#
# TO ENABLE: apply 20260827030000, run this workflow once via the Actions tab
# and confirm the assertion step passes, then uncomment the two `schedule`
# lines below. The script itself refuses to start without the column and says
# so by name, so a premature manual run is legible rather than cryptic.
#
# STATUS 2026-09-03 (verified read-only against production): the column and
# its index exist. Prod recorded the change as history version 20260827155703
# (name roster_status_provenance), not as the repo's 20260827030000; same
# statements, different ledger (see scripts/ops/dump-prod-schema.sh 4b). The
# remaining gate is one green manual run. Note the second reason this column
# stayed NULL: pg_cron job 33 (rebuild-talent-metrics, 08:58 UTC) deleted the
# whole season nightly and re-inserted only the xG columns, so anything this
# job wrote survived at most until the next morning. Fixed by migration
# 20260903180000_talent_metrics_rebuild_preserves_columns; enable this
# schedule only after that migration is applied, or the writes will not stick.

on:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: injury-status-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync injury / roster designations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      - run: pip install -r data-pipeline/requirements.txt

      # Season is derived from the date by the script, deliberately not set
      # here. A CITRUS_DEFAULT_SEASON hardcode in a sibling workflow is what
      # froze player_directory at 2025 while the SQL joins pivoted to 2026.
      #
      # PYTHONUNBUFFERED so a hang shows its last line rather than an empty
      # log — the 2026-08-07 kill showed only "Script starting..." across
      # 19m43s because Python block-buffers 8 KiB under Actions' log capture.
      - name: Fetch and resolve injury designations
        # `shell: bash` is `bash -eo pipefail`, so the tee below cannot mask a
        # non-zero exit from the script (the default shell has no pipefail).
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
          # PROXY ROTATION (2026-08-27)
          #
          # This workflow shipped without these three. citrus_request therefore
          # ran in DIRECT mode from a GitHub Actions runner IP, and ESPN
          # returned 403 in 120ms:
          #
          #   [ProxyManager] Proxy creds missing (CITRUS_PROXY_USERNAME/
          #                  PASSWORD/API_URL) - running in direct mode.
          #   [Citrus-IP-Rotator] HTTP error 403 (0.12s)
          #
          # The same request succeeds from other datacenter IPs, and
          # citrus_request already sends a full realistic header set. So this is
          # ESPN blocking GitHub's published runner ranges, not a User-Agent
          # problem, and no amount of header tuning fixes it.
          #
          # Same three vars nhl-archive.yml and playoff-sync.yml pass.
          CITRUS_PROXY_USERNAME: ${{ secrets.CITRUS_PROXY_USERNAME }}
          CITRUS_PROXY_PASSWORD: ${{ secrets.CITRUS_PROXY_PASSWORD }}
          CITRUS_PROXY_API_URL: ${{ secrets.CITRUS_PROXY_API_URL }}
        run: python -u data-pipeline/acquisition/fetch_injury_status.py 2>&1 | tee /tmp/injury.log

      # POST-RUN ASSERTION.
      #
      # Deliberately NOT a row count. "At least N players are injured" is not
      # a property of a working sync — it is a property of the league being
      # unlucky, and it passes trivially in a week with many injuries even if
      # the writer is broken.
      #
      # What this job claims to do is WRITE. So the assertion checks that a
      # write actually landed: the freshest roster_status_updated_at must be
      # within the hour. That fails if the script no-ops, if the feed shape
      # changes, if resolution collapses below the floor, or if the upsert
      # silently writes nothing — none of which a count would catch.
      - name: Assert a write actually landed
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Carried for symmetry with the step above. This step reaches only
          # Supabase via SupabaseRest, which does not route through
          # ProxyManager, so it does not need them TODAY -- but a step that
          # runs Python and omits them is exactly how the 403 above shipped.
          CITRUS_PROXY_USERNAME: ${{ secrets.CITRUS_PROXY_USERNAME }}
          CITRUS_PROXY_PASSWORD: ${{ secrets.CITRUS_PROXY_PASSWORD }}
          CITRUS_PROXY_API_URL: ${{ secrets.CITRUS_PROXY_API_URL }}
        run: |
          python -u -c "
          import sys, os, datetime as dt
          sys.path.insert(0, 'data-pipeline')
          import _bootstrap
          from data_pipeline.utils.supabase_rest import SupabaseRest

          db = SupabaseRest()
          rows = db.select(
              'player_talent_metrics',
              select='roster_status_updated_at',
              filters=[('roster_status_source', 'not.is', 'null')],
              order='roster_status_updated_at.desc',
              limit=1,
          ) or []

          if not rows:
              print('FAIL: no row carries a roster_status_source — the sync wrote nothing')
              sys.exit(1)

          stamp = rows[0]['roster_status_updated_at']
          written = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
          age_min = (dt.datetime.now(dt.timezone.utc) - written).total_seconds() / 60

          print(f'newest roster_status write: {stamp} ({age_min:.1f} min ago)')
          if age_min > 60:
              print('FAIL: newest write is over an hour old — this run did not persist')
              sys.exit(1)
          print('OK: a write from this run is present')
          "

      # One row in public.ops_ci_runs so the outcome of each sync is readable
      # through the Supabase MCP (docs/RUNBOOKS/CI_TELEMETRY.md). Matters
      # doubly here: the schedule is off until one manual run is green, and
      # "was it green" should be a query, not a screenshot.
      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/injury.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
