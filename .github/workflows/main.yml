name: Projection Output Health

on:
  schedule:
    - cron: '30 10 * * *'  # After SQL ROS (08:50 UTC) and per-game (09:05 UTC).
  workflow_dispatch:      # Manual trigger button

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test read-only health contract
        run: python -m unittest discover -s scripts/ops -p 'test_check_projection_outputs.py'

      # The database cron jobs own the active SQL projections. Do not run the
      # legacy Python writer against those same rows from this workflow.
      - name: Verify SQL-owned projection outputs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: python scripts/ops/check_projection_outputs.py 2>&1 | tee /tmp/nightly.log

      # One row in public.ops_ci_runs (last line of the batch output as the
      # summary) so Claude can see whether last night's batch ran, through the
      # Supabase MCP. Never fails the job. See docs/RUNBOOKS/CI_TELEMETRY.md.
      - name: Report run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          log-file: /tmp/nightly.log
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
