name: Nightly Projection Batch

on:
  schedule:
    - cron: '0 7 * * *'  # 2 AM ET (7 AM UTC)
  workflow_dispatch:      # Manual trigger button

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'data-pipeline/requirements.txt'

      # The Python package imports resolve as `data_pipeline.*` (underscore).
      # A symlink `data_pipeline -> data-pipeline` exists at the repo root so
      # `python data-pipeline/projections/...` runs with the package importable
      # from CWD. Do not rename — every Python entry point depends on it.
      - run: pip install -r data-pipeline/requirements.txt

      # Align with ci.yml / production-deploy.yml secret names. The script
      # reads VITE_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY from env
      # (see data-pipeline/projections/nightly_projection_batch.py lines 78-81).
      - name: Run nightly projections
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data-pipeline/projections/nightly_projection_batch.py --season 2025
