# ── Citrus API — Cloud Run Service Definition ───────────────────────
# Declarative config for `gcloud run services replace service.yaml`
# Region: us-central1 | Registry: citrus-api in Artifact Registry
#
# Usage:
#   gcloud run services replace ops/cloudrun/service.yaml --region=us-central1
#
# Note: Environment variables with SECRET references require the secrets
# to be created first in Google Secret Manager. For initial setup, use
# the deploy script at ops/cloudrun/deploy.sh instead.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: citrus-api
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/citrus-fantasy-prod/citrus-api/server:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_SERVICE_ROLE_KEY
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
