# ── Citrus API — Cloud Run Service Definition ───────────────────────
# Declarative config for `gcloud run services replace service.yaml`
# Region: northamerica-northeast1 (Montreal, beside Supabase ca-central-1 and the engine VM) | Registry: citrus-api in Artifact Registry (us-central1; pulled cross-region)
#
# Usage:
#   gcloud run services replace ops/cloudrun/service.yaml --region=northamerica-northeast1
#
# Note: Environment variables with SECRET references require the secrets
# to be created first in Google Secret Manager. For initial setup, use
# the deploy script at ops/cloudrun/deploy.sh instead.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: citrus-api
  labels:
    cloud.googleapis.com/location: northamerica-northeast1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 240
      containers:
        - image: us-central1-docker.pkg.dev/citrus-fantasy-prod/citrus-api/server:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DRAFT_KIT_PDF_READY
              value: "true"
            - name: DRAFT_KIT_CHECKOUT_ENABLED
              value: "false"
            - name: DRAFT_KIT_BUNDLE_URI
              value: "gs://citrus-fantasy-prod-research-evidence/draft-kit/review/20260919/2a12d68a25f0fd45134a9ca457e3c7a8c4ab81d61239f46f2f183a608e234883/delivery-bundle.tar.gz"
            - name: DRAFT_KIT_BUNDLE_SHA256
              value: "1686e19c9029106d50019dda7d014a1ff7d60d82f811c9cf78203f66ca61fb0f"
            - name: DRAFT_KIT_BUNDLE_REVISION
              value: "2a12d68a25f0fd45134a9ca457e3c7a8c4ab81d61239f46f2f183a608e234883"
            - name: DRAFT_KIT_STRIPE_PRICE_ID
              value: "price_1UHBC7344c85bYub2ayVinQo"
            - name: DRAFT_KIT_CURRENCY
              value: cad
            - name: DRAFT_KIT_AMOUNT_MINOR
              value: "799"
            - name: DRAFT_KIT_TIER
              value: kit
            - name: DRAFT_KIT_ACCESS_UNTIL
              value: "2027-07-01T05:59:59Z"
            - name: DRAFT_KIT_UPDATES_UNTIL
              value: "2026-09-30T05:59:59Z"
            - name: DRAFT_KIT_SITE_ORIGIN
              value: "https://citrusfantasysports.com"
            - name: DRAFT_KIT_TERMS_URL
              value: "https://citrusfantasysports.com/terms-of-service.html"
            - name: DRAFT_KIT_TERMS_VERSION
              value: "2026-09-18-draft-kit-v1"
            - name: DRAFT_KIT_TAX_MODE
              value: automatic
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: "1"
                  name: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: "1"
                  name: STRIPE_WEBHOOK_SECRET
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_SERVICE_ROLE_KEY
            # WHERE THE DRAFT ENGINE LIVES (2026-09-03).
            #
            # `gcloud run services replace` is DECLARATIVE: it deletes every
            # variable this file does not name. PRE_DRAFT_CHECKLIST.md tells
            # the on-call engineer to run exactly that command when scaling
            # looks wrong, so before these two lines existed, following the
            # checklist an hour before a draft would silently remove the only
            # thing telling browsers where to open a WebSocket.
            #
            # Unset, `server/src/routes/drafts.ts:151` falls back to
            # `localhost`, discovery still answers 200, and every draft room
            # in production spins on "Waiting for draft state..." behind a
            # reconnect banner. Keep these in sync with the `env_vars` block
            # in .github/workflows/production-deploy.yml.
            - name: DRAFT_WS_HOST
              value: "draft.citrusfantasysports.com"
            - name: DRAFT_WS_PORT
              value: "443"
            # The draft canary's league and user (2026-09-17); see the note
            # above env_vars in production-deploy.yml. Keep in sync.
            - name: DRAFT_CANARY_LEAGUE_ID
              value: "8c715c23-d3a8-4bd9-86cc-6265083c3e72"
            - name: DRAFT_CANARY_USER_ID
              value: "39040c29-f860-430a-802e-4ca6e4fa0a7d"
            # Both secrets below were set by hand on the Iowa service and
            # never declared here, so the Montreal service was born without
            # them (2026-09-16: every draft room down, all signals green).
            # `services replace` on this file would have deleted them from
            # any service that had them. Same Secret Manager names the
            # engine VM and production-deploy.yml use; deployConfig.test.ts
            # pins them in both files.
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: supabase-jwt-secret
            - name: SCHEDULED_TRIGGER_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: scheduled-trigger-secret
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
