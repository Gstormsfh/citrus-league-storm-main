
<!DOCTYPE html>
<html lang="en" style="background: #0C1811;">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply saved theme before first paint (prevents flash)
      (function(){var t=localStorage.getItem('citrus-theme');if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Citrus - A Fresh Take on Fantasy Sports</title>

    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- PR18 (2026-09-05): the fonts load WITHOUT blocking the first paint.
         This sheet used to be an @import at the top of index.css, which
         made the whole app stylesheet -- and so the first frame -- wait on
         a round trip to Google: on a cold native start with a slow or
         absent network, the launch image sat there until the fetch gave
         up. `media="print"` fetches it off the render path; `onload`
         switches it live and the faces swap in (display=swap). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Graduate&family=Alfa+Slab+One&family=Pacifico&family=Bangers&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Bebas+Neue&family=Calistoga&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Graduate&family=Alfa+Slab+One&family=Pacifico&family=Bangers&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Bebas+Neue&family=Calistoga&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- iOS PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Join Citrus, the fantasy sports platform with a refreshing UI and Stormy AI assistant to help you win your leagues." />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9217677881289656"
         crossorigin="anonymous"></script>
  </head>

  <body>
    <div id="root" style="padding: 20px; font-family: sans-serif; text-align: center; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0C1811;">
      <div>
        <h1 style="color: #FFF8F0; margin-bottom: 20px;">Citrus</h1>
        <div style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #FF6B1A; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <p style="color: rgba(255,255,255,0.55);">Loading application...</p>
        <p id="status" style="color: rgba(255,255,255,0.45); font-size: 12px; margin-top: 10px;">Initializing...</p>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Boot monitor — only touches the DOM if React never mounts.
      // React sets window.__REACT_MOUNTED = true once it renders.
      (function() {
        var statusEl = document.getElementById('status');

        function updateStatus(msg, isError) {
          if (statusEl) {
            statusEl.textContent = msg;
            if (isError) statusEl.style.color = '#fca5a5';
          }
        }

        // Listen for JS loading errors (404, network, syntax)
        window.addEventListener('error', function(event) {
          // Don't touch DOM if React already mounted
          if (window.__REACT_MOUNTED) return;
          updateStatus('Error: ' + (event.message || 'script failed'), true);
        }, true);

        // Safety timeout — if React hasn't mounted after 12s, show help text
        setTimeout(function() {
          if (window.__REACT_MOUNTED) return;
          updateStatus('Still loading — please wait...', false);
        }, 6000);

        setTimeout(function() {
          if (window.__REACT_MOUNTED) return;
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center;max-width:600px;margin:0 auto;background:#0C1811;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center"><h2 style="color:#fca5a5;margin-bottom:16px">Page failed to load</h2><p style="color:rgba(255,255,255,0.55);margin-bottom:16px">JavaScript could not start. Try refreshing or clearing your cache.</p><button onclick="location.reload()" style="padding:8px 24px;background:#FF6B1A;color:#0F1F15;border:none;border-radius:6px;cursor:pointer;font-weight:bold">Reload</button></div>';
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
