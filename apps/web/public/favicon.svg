<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Citrus slice favicon for Citrus -->
  <!-- Outer rind -->
  <circle cx="32" cy="32" r="30" fill="#F9A436"/>
  <!-- Inner flesh -->
  <circle cx="32" cy="32" r="25" fill="#FFD580"/>
  <!-- Segment lines (white membrane) -->
  <line x1="32" y1="7" x2="32" y2="57" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="57" y2="32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14.3" y1="14.3" x2="49.7" y2="49.7" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49.7" y1="14.3" x2="14.3" y2="49.7" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center pith -->
  <circle cx="32" cy="32" r="5" fill="white" opacity="0.7"/>
  <!-- Segment juice vesicle dots for detail -->
  <circle cx="32" cy="17" r="2" fill="#F9A436" opacity="0.5"/>
  <circle cx="32" cy="47" r="2" fill="#F9A436" opacity="0.5"/>
  <circle cx="17" cy="32" r="2" fill="#F9A436" opacity="0.5"/>
  <circle cx="47" cy="32" r="2" fill="#F9A436" opacity="0.5"/>
  <!-- Leaf -->
  <ellipse cx="36" cy="4" rx="6" ry="3" fill="#459345" transform="rotate(30 36 4)"/>
  <line x1="33" y1="2" x2="38" y2="6" stroke="#2d6b2d" stroke-width="0.8"/>
</svg>
