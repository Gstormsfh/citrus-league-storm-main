[auth]
# Require email verification before sign-in
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Branded email subjects — these also need to be set in the Supabase Dashboard
# under Authentication > Email Templates for production.
[auth.email.template.confirmation]
subject = "Confirm your email — Citrus Fantasy Sports"
content_path = "./supabase/templates/confirm_signup.html"

[auth.email.template.recovery]
subject = "Reset your password — Citrus Fantasy Sports"
content_path = "./supabase/templates/reset_password.html"

[auth.email.template.magic_link]
subject = "Sign in to Citrus Fantasy Sports"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm email change — Citrus Fantasy Sports"
content_path = "./supabase/templates/email_change.html"
